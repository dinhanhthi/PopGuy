			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Embed the MLX Metal shader bundle next to the helper so MLX can load its\n# default.metallib at runtime (the helper searches its own directory). Copy the\n# whole resource bundle (a proper, signable nested bundle) and code-sign it so the\n# app's outer code-signing accepts it.\nset -e\nSRC=\"${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle\"\nDEST_DIR=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers\"\nDEST=\"${DEST_DIR}/mlx-swift_Cmlx.bundle\"\nif [ -d \"$SRC\" ]; then\n  mkdir -p \"$DEST_DIR\"\n  rm -rf \"$DEST\"\n  cp -R \"$SRC\" \"$DEST\"\n  # Remove the stale loose copy from earlier attempts, if present.\n  rm -f \"${DEST_DIR}/mlx.metallib\"\n  # Release builds need a secure timestamp on the nested bundle for notarization.\n  SIGN_TS=\"\"\n  if [ \"${CONFIGURATION}\" = \"Release\" ]; then SIGN_TS=\"--timestamp\"; fi\n  if [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n    codesign --force ${SIGN_TS} --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"$DEST\"\n  else\n    codesign --force --sign - \"$DEST\"\n  fi\nfi\n";
		};
